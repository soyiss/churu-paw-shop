<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>입고등록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<body>

    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link" href="dashboard.html">홈</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active " href="productregister.html">츄르등록</a>
        </li>        
        <li class="nav-item">
            <a class="nav-link" href="inbound.html">입고등록</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="stocklist.html">재고현황</a>
        </li>
        <li class="nav-item">
            <a class="nav-link " href="saleshistory.html">판매내역</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="memberlist.html">회원리스트</a>
        </li>
    </ul>

    <div class="container mt-4">

        <h2>🐱 츄르 등록</h2>
        <p class="text-muted">
            새로운 츄르 상품을 등록합니다.
        </p>

        <div class="card p-4 mb-4">

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">상품코드</label>
                    <input type="text"
                           class="form-control"
                           placeholder="CH011">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">상품명</label>
                    <input type="text"
                           class="form-control"
                           placeholder="냥냥 오리츄르">
                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">맛</label>

                    <select class="form-select">
                        <option selected>선택하세요</option>
                        <option>참치</option>
                        <option>연어</option>
                        <option>닭가슴살</option>
                        <option>새우</option>
                        <option>게살</option>
                        <option>치즈</option>
                        <option>가다랑어</option>
                        <option>소고기</option>
                        <option>우유</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">가격</label>
                    <input type="number"
                           class="form-control"
                           placeholder="3000">
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">상품설명</label>

                <textarea class="form-control"
                          rows="4"
                          placeholder="상품 설명 입력"></textarea>
            </div>

            <button class="btn btn-primary w-100">
                상품등록
            </button>

        </div>

        <div class="card p-4">

            <h4 class="fw-bold mb-3">
                📋 최근 등록 상품
            </h4>

            <table class="table table-striped table-hover table-bordered">

                <thead class="table-light">
                    <tr>
                        <th>상품코드</th>
                        <th>상품명</th>
                        <th>맛</th>
                        <th>가격</th>
                        <th>등록일</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>CH001</td>
                        <td>냥냥 참치츄르</td>
                        <td>참치</td>
                        <td>3,000원</td>
                        <td>2026-06-09</td>
                    </tr>

                    <tr>
                        <td>CH002</td>
                        <td>냥냥 연어츄르</td>
                        <td>연어</td>
                        <td>4,000원</td>
                        <td>2026-06-08</td>
                    </tr>

                    <tr>
                        <td>CH003</td>
                        <td>냥냥 새우츄르</td>
                        <td>새우</td>
                        <td>3,500원</td>
                        <td>2026-06-07</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>
</body>
</html>
