<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>join page</title>

    <style>
    body {
        background-color: #f7f1eb;
        margin: 0;
        padding: 0;

        display: flex;
        justify-content: center;
        align-items: center;

        min-height: 100vh;

        font-family: Arial, sans-serif;
    }

      /* 메인 카드 */

    .main-card {
        position: relative;
        width: 700px;
    }

    .main-card img {
        width: 100%;
        display: block;
    }


      /* 버튼 */

    .button-83 {
        appearance: button;

        background-color: transparent;
        background-image: linear-gradient(to bottom, #fff, #f8eedb);

        border: 0 solid #e5e7eb;
        border-radius: 0.8rem;

        box-sizing: border-box;

        color: #482307;

        cursor: pointer;

        font-size: 16px;
        font-weight: 700;

        padding: 12px;

        transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);

        box-shadow:
        -6px 8px 10px rgba(81, 41, 10, 0.1),
        0px 2px 2px rgba(81, 41, 10, 0.2);
        width: 100%;
        margin-top: 5px;
    }

    .button-83:hover {
        transform: translateY(-3px);
    }

    .button-83:active {
        transform: translateY(2px);
    }

    input {
        width: 90%;

        padding: 12px;

        margin-bottom: 15px;

        border: 1px solid #ddd;

        border-radius: 10px;

        font-size: 16px;
    }

    .join-form {
        position: absolute;

        top: 300px;

        left: 50%;

        transform: translateX(-50%);

        width: 300px;

        text-align: center;
    }
    .link-area {
        margin-top: 20px;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 10px;
    }

    .link-area a {
        text-decoration: none;
        color: #9b6544;
    }
    </style>
</head>

<body>
    <div class="main-card">
    <img src="img/joinpage.png" alt="join" />

    <div class="join-form">
        <input type="text" placeholder="아이디" />
        <input type="password" placeholder="비밀번호" />
        <input type="text" placeholder="이름" />
        <input type="text" placeholder="생년월일" />
        <input type="tel" placeholder="전화번호" />

        <button class="button-83">회원가입</button>
        <div class="link-area">
        <a href="loginpage.html">로그인</a>

        <span>|</span>

        <a href="homepage.html">홈으로</a>
        </div>
    </div>
    </div>
</body>
</html>
