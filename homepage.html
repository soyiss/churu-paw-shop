<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Churu Paw Shop</title>

    <style>

        body{
            background-color: #F7F1EB;
            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            font-family: Arial, sans-serif;
        }

        /* 메인 카드 */

        .main-card{
            position: relative;
            width: 700px;
        }

        .main-card img{
            width: 100%;
            display: block;
        }

        .button-area{
        position:absolute;

        top:430px;
        left:50%;

        transform:translateX(-50%);

        display:flex;
        flex-direction:row;

        gap:20px;
        margin-top: 30px;
        }

        /* 버튼 */

        .button-83 {

            appearance: button;

            background-color: transparent;
            background-image: linear-gradient(to bottom, #fff, #f8eedb);

            border: 0 solid #e5e7eb;
            border-radius: .8rem;

            box-sizing: border-box;

            color: #482307;

            cursor: pointer;

            font-size: 18px;
            font-weight: 700;

            padding: 15px 40px;

            transition: all .1s cubic-bezier(.4, 0, .2, 1);

            box-shadow:
                -6px 8px 10px rgba(81,41,10,0.1),
                0px 2px 2px rgba(81,41,10,0.2);
        }

        .button-83:hover{
            transform: translateY(-3px);
        }

        .button-83:active{
            transform: translateY(2px);
        }

    </style>

</head>

<body>

    <div class="main-card">

        <img src="img/homepage.png" alt="homepage">

        <div class="button-area">

            <button class="button-83"
                    onclick="location.href='loginpage.html'">
                로그인
            </button>

            <button class="button-83"
                    onclick="location.href='joinpage.html'">
                회원가입
            </button>

        </div>

    </div>

</body>

</html>
