<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원 대시보드</title>

<style>

body{
    margin:0;
    padding:0;
    background:#F7F1EB;

    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.dashboard{

    width:1000px;

    background:#FFFDF9;

    border:6px solid #7A4E3A;
    border-radius:40px;

    padding:40px;
}

.title{

    text-align:center;

    font-size:42px;
    font-weight:bold;

    color:#482307;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    font-size:18px;
    color:#9B6544;

    margin-bottom:40px;
}

.summary-area{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;

    margin-bottom:40px;
}

.summary-card{

    background:#FFF8ED;

    border-radius:20px;

    padding:25px;

    text-align:center;

    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.summary-card h3{

    margin:0;
    font-size:18px;

    color:#7A4E3A;
}

.summary-card p{

    margin-top:15px;

    font-size:28px;
    font-weight:bold;

    color:#482307;
}

.menu-area{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:25px;
}

.menu-btn{

    background:#FFF8ED;

    border:none;

    border-radius:20px;

    padding:40px 20px;

    cursor:pointer;

    box-shadow:0 3px 10px rgba(0,0,0,0.1);

    transition:0.2s;
}

.menu-btn:hover{

    transform:translateY(-5px);
}

.menu-icon{

    font-size:50px;
}

.menu-text{

    margin-top:15px;

    font-size:20px;
    font-weight:bold;

    color:#482307;
}
.menu-area a{
    text-decoration:none;
}

.menu-btn{
    width:100%;
}

</style>
</head>

<body>

    
<div class="dashboard">

    <div class="title">
        🐾 회원 대시보드
    </div>

    <div class="subtitle">
        냥이가 좋아하는 츄르를 골라보세요!
    </div>

    <div class="summary-area">

        <div class="summary-card">
            <h3>🛒 판매중 상품</h3>
            <p>10종</p>
        </div>

        <div class="summary-card">
            <h3>🔥 인기 상품</h3>
            <p> 참치츄르</p>
        </div>

        <div class="summary-card">
            <h3>📋 내 구매내역</h3>
            <p>5건</p>
        </div>

        <div class="summary-card">
            <h3>💰 누적 구매금액 </h3>
            <p>34,000원</p>
        </div>

    </div>

    <div class="menu-area">

        <!-- Java 연결 시 권한별 메뉴 제어 예정 -->

        <a href="productlist.html">
            <button class="menu-btn">
                <div class="menu-icon">🛒</div>
                <div class="menu-text">츄르구매</div>
            </button>
        </a>

        <a href="purchasehistory.html">
            <button class="menu-btn">
                <div class="menu-icon">📋</div>
                <div class="menu-text">구매내역</div>
            </button>
        </a>       
        
        <a href="myinfo.html">
        <button class="menu-btn">
            <div class="menu-icon">👤</div>
            <div class="menu-text">내 정보</div>
        </button>
        </a>       


    </div>

</div>

</body>
</html>
