<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>

    <style>

        body {
            background-color: #F7F1EB;
            margin: 0;
            padding: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            font-family: Arial, sans-serif;
        }

        /* 메인 카드 */

        .main-card {
            position: relative;
            width: 700px;
        }

        .main-card img {
            width: 100%;
            display: block;
        }

        /* 로그인 폼 */

        .login-form {
            position: absolute;

            top: 350px;
            left: 50%;

            transform: translateX(-50%);

            width: 300px;

            text-align: center;
        }

        /* 입력창 */

        input {
            width: 90%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            box-sizing: border-box;
        }

        /* 버튼 */

        .button-83 {
            appearance: button;

            background-color: transparent;
            background-image: linear-gradient(to bottom, #fff, #f8eedb);

            border: 0 solid #e5e7eb;
            border-radius: 0.8rem;

            box-sizing: border-box;

            color: #482307;

            cursor: pointer;

            width: 90%;

            padding: 12px;

            font-size: 16px;
            font-weight: 700;

            transition: all 0.1s cubic-bezier(.4, 0, .2, 1);

            box-shadow:
                -6px 8px 10px rgba(81, 41, 10, 0.1),
                0px 2px 2px rgba(81, 41, 10, 0.2);
        }

        .button-83:hover {
            transform: translateY(-3px);
        }

        .button-83:active {
            transform: translateY(2px);
        }

        /* 링크 */

        .link-area {
            margin-top: 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;
        }

        .link-area a {
            text-decoration: none;
            color: #9B6544;
        }

    </style>
</head>

<body>

    <div class="main-card">

        <img src="img/loginpage.png" alt="login">

        <div class="login-form">

            <input type="text" placeholder="아이디">

            <input type="password" placeholder="비밀번호">

            <button class="button-83">
                로그인
            </button>

            <div class="link-area">

                <a href="joinpage.html">회원가입</a>

                <span>|</span>

                <a href="homepage.html">홈으로</a>

            </div>

        </div>

    </div>

</body>
</html>
